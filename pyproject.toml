[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnimcp-pro"
version = "1.0.0"
description = "The Protocol-Native Social Media Operating System & Command Center"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=0.4.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "requests>=2.32.0",
    "patchright>=1.49.0",
    "anyio>=4.6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "markdown>=3.7",
    "httpx>=0.27.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".agent",
    ".agents",
    ".gemini",
    ".gsd",
    "node_modules",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
